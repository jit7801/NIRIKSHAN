<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A2C" />
      <stop offset="100%" stop-color="#183B56" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inner Ring -->
  <circle cx="32" cy="32" r="26.5" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.5" />

  <!-- Parliament Dome Motif in Background -->
  <!-- Finial / Apex Spire -->
  <line x1="32" y1="10" x2="32" y2="15" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <!-- Dome Top Cupola -->
  <ellipse cx="32" cy="15.5" rx="3" ry="1.5" fill="url(#goldGrad)" />
  <!-- Dome Arch -->
  <path d="M20 25 C20 16 44 16 44 25 Z" fill="url(#goldGrad)" opacity="0.9" />
  <!-- Dome Cornice / Base Arch -->
  <rect x="18" y="24.5" width="28" height="2" rx="0.5" fill="url(#goldGrad)" />

  <!-- Pillars -->
  <rect x="20" y="27" width="2.2" height="12" rx="0.5" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="25" y="27" width="2.2" height="12" rx="0.5" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="36.8" y="27" width="2.2" height="12" rx="0.5" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="41.8" y="27" width="2.2" height="12" rx="0.5" fill="url(#goldGrad)" opacity="0.8" />
  <!-- Plinth Base -->
  <rect x="17" y="39" width="30" height="2.5" rx="0.8" fill="url(#goldGrad)" />

  <!-- Shield of Intelligence (Foreground right-center) -->
  <path d="M32 21 L45 25 C45 36 38 45 32 48 C26 45 19 36 19 25 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2" />

  <!-- Radar Pulse Arcs inside Shield -->
  <path d="M32 42 C35.5 39.5 38 35.5 38 30.5" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <path d="M32 37.5 C34 35.5 35.5 33 35.5 29.5" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="32" cy="31" r="2.2" fill="url(#goldGrad)" />
  <circle cx="32" cy="31" r="0.9" fill="#FFFFFF" />
</svg>