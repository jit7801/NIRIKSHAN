<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A2C" />
      <stop offset="100%" stop-color="#183B56" />
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1A2C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Emblem Icon (x: 4 to 60) -->
  <g transform="translate(2, 2)" filter="url(#logoShadow)">
    <!-- Base Circular Badge -->
    <circle cx="30" cy="30" r="28" fill="url(#logoBgGrad)" stroke="url(#logoGoldGrad)" stroke-width="2" />
    <circle cx="30" cy="30" r="24.5" stroke="#F59E0B" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.6" />

    <!-- Parliament Dome Motif in Background -->
    <line x1="30" y1="10" x2="30" y2="14" stroke="url(#logoGoldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <ellipse cx="30" cy="14.5" rx="2.5" ry="1.2" fill="url(#logoGoldGrad)" />
    <path d="M19 23 C19 15 41 15 41 23 Z" fill="url(#logoGoldGrad)" opacity="0.9" />
    <rect x="17" y="22.5" width="26" height="1.8" rx="0.5" fill="url(#logoGoldGrad)" />

    <!-- Pillars -->
    <rect x="19" y="25" width="2" height="11" rx="0.5" fill="url(#logoGoldGrad)" opacity="0.85" />
    <rect x="23.5" y="25" width="2" height="11" rx="0.5" fill="url(#logoGoldGrad)" opacity="0.85" />
    <rect x="34.5" y="25" width="2" height="11" rx="0.5" fill="url(#logoGoldGrad)" opacity="0.85" />
    <rect x="39" y="25" width="2" height="11" rx="0.5" fill="url(#logoGoldGrad)" opacity="0.85" />
    <rect x="16" y="36.5" width="28" height="2.2" rx="0.6" fill="url(#logoGoldGrad)" />

    <!-- Shield of Intelligence -->
    <path d="M30 19 L42 23 C42 33 36 41 30 44 C24 41 18 33 18 23 Z" 
          fill="url(#logoShieldGrad)" 
          stroke="url(#logoGoldGrad)" 
          stroke-width="1.8" />

    <!-- Radar Pulse Arcs inside Shield -->
    <path d="M30 39 C33.2 36.8 35.5 33 35.5 28.5" stroke="url(#logoGoldGrad)" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M30 35 C31.8 33.2 33.2 31 33.2 27.5" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" fill="none" />
    <circle cx="30" cy="29" r="2" fill="url(#logoGoldGrad)" />
    <circle cx="30" cy="29" r="0.8" fill="#FFFFFF" />
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(70, 0)">
    <!-- Primary Brand Title -->
    <text x="0" y="28" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1F2933" letter-spacing="-0.02em">
      MPLADS <tspan fill="#183B56" font-weight="600">Risk Intel</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="44" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#667085" letter-spacing="-0.01em">
      AI Decision Support System
    </text>
  </g>
</svg>
